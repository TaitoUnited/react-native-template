name: Notify Clients
description: Sends release email to clients
inputs:
  SENDGRID_API_KEY:
    description: SendGrid API key
    required: true
  ANDROID_BUILD_URL:
    description: URL to the Android build
    required: false
  IOS_BUILD_URL:
    description: URL to the iOS build
    required: false
  platform:
    description: Platform for which the build was made
    required: true
  environment:
    description: Environment for which the build was made
    required: true

runs:
  using: composite
  steps:
    - name: 📧 Send emails
      uses: licenseware/send-email-notification@v1
      with:
        api-key: ${{ inputs.SENDGRID_API_KEY }}
        subject: New Release for ${{ inputs.platform }} (${{ inputs.environment }} environment)
        from-email: taito.dev@gmail.com
        to-email: support@taitounited.fi
        markdown-body: |
          # New Release for ${{ inputs.platform }} 🚀

          ${{ inputs.ANDROID_BUILD_URL && format('**Android:** [Download here]({0})', inputs.ANDROID_BUILD_URL) || '' }}
          ${{ inputs.IOS_BUILD_URL && format('**iOS:** [Download here]({0})', inputs.IOS_BUILD_URL) || '' }}
